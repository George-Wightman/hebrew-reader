<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hebrew Reader">
  <!-- The app's own identity: warm paper, teal ink, and the letter it opens with.
       Authored as SVG rather than exported as PNG so it stays crisp at every size a
       launcher asks for, and stays a few hundred bytes. The glyph sits inside the
       central 80% so it survives a maskable crop on Android. -->
  <rect width="512" height="512" fill="#f5f0e7"/>
  <!-- The shin-dot: real Hebrew orthography marks ש as "shin" (vs שׂ "sin") with a dot
       on this exact stroke. Reusing it here means the mark reads as authentic rather
       than decorative, and in --gold it borrows the one color this app reserves for
       achievement, rather than echoing the nav's teal active-tab underline. -->
  <circle cx="313" cy="138" r="19" fill="#b3803a"/>
  <text x="256" y="256" fill="#0d6e6e"
        font-family="David, 'Times New Roman', serif" font-size="236" font-weight="700"
        text-anchor="middle" dominant-baseline="central">&#1513;</text>
</svg>
